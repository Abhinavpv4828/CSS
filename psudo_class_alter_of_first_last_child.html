<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-of-type{
            color: blue;
            background-color: gray;
        }
        li:last-of-type{
            color: aqua;
            background-color: red;
        }
        li:nth-child(2){
            color: green;
            background-color: yellow;
        }
        li:nth-child(3){
            color: red;
            background-color: black;
        }
    </style>
</head>
<body>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT</li>
    </ul>
</body>
</html>
